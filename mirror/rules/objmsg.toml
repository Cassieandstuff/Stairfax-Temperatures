# ObjMsg: the per-object message queue (objlib.c), widened for a 64-bit host.
#
# Entries are {u32 message; u32 sender; u32 param}. sender is always a GameObject*
# (ObjMsg_Send* store `(u32)sender`) and param often carries a pointer too (the
# send API already takes it as uintptr_t). As u32 the queue truncated both.
#
# Layout: the queue is {u32 count; u32 capacity; ObjMsgEntry entries[]}, and every
# function addresses entry i by hand as `(u8*)queue + ((i + i + i) << 2)`, through
# ObjMsgQueueCursor (whose entry / nextEntry alias entries[i] / entries[i + 1]).
# With pointer-width sender/param an entry is sizeof(ObjMsgEntry) == 24, so those
# strides and the allocation size `(capacity * 3 + 2) * 4` are rewritten in terms
# of sizeof/offsetof. The cursor trick itself still holds: entry sits at offset 8,
# nextEntry at 8 + sizeof(ObjMsgEntry), exactly entries[i] / entries[i + 1].
#
# ObjMsg_Pop / ObjMsg_Peek return sender and param through out-parameters, which
# become uintptr_t*; every caller's receiving storage is made pointer-width below
# (the message out-parameter stays u32*).

# --- queue entry -------------------------------------------------------------------

[[pointer.retype]]
file = "decomp/src/main/objlib.c"
line = 141
symbol = "sender"
from = "u32"
to = "uintptr_t"

[[pointer.retype]]
file = "decomp/src/main/objlib.c"
line = 142
symbol = "param"
from = "u32"
to = "uintptr_t"

