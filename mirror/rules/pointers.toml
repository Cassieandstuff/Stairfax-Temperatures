# P2 pointer-width resolutions.
#
# Consumed and APPLIED by tools/mirror/mirror_build.py --emit / build_mirror.py
# (pass P2). Rule kinds, all deterministic and idempotent. Every rule names the
# one TU it applies to with file= (required: an unscoped symbol rule could rewrite
# a same-named variable in an unrelated TU, so the loader rejects it).
#
#   [[pointer.promote]]  file="..." symbol="gFoo" to="uintptr_t"  [line=NN]
#       Widen the declaration of a narrow-int variable that holds a pointer.
#       Without line=, targets brace-depth-0 decls (globals + K&R params) only;
#       add line=NN to pin a local or an ambiguous name.
#
#   [[pointer.ret]]      file="..." func="fn" to="uintptr_t"
#       Widen a function's return type (prototype + definition) when it returns a
#       pointer through a narrow int.
#
#   [[pointer.retype]]   file="..." line=NN symbol="p" from="u32" to="uintptr_t"
#       Change the declared type of one symbol on one line — function parameters
#       (prototype and definition are separate lines/rules), locals, globals.
#       Refuses if `<from> <symbol>` matches more than once unless occurrence=N.
#
#   [[pointer.widen]]    file="..." line=NN
#       Widen a narrowing cast that touches a pointer at that line:
#         (T*)(int)x     -> (T*)(uintptr_t)x
#         (int)mmAlloc.. -> (uintptr_t)mmAlloc..
#
#   [[pointer.widen_cast]] file="..." line=NN from="u32" to="uintptr_t" [occurrence=N]
#       Widen one bare `(from)` cast at a line, including inside a #define body
#       (e.g. a pointer-packing conversion macro). Refuses if the line has more
#       than one such cast unless occurrence= picks one.
#
#   [[pointer.stride]]   file="..." line=NN symbol="walk" from="4" to="sizeof(void*)"
#       A pointer-array walk stepping by the GameCube pointer size: rewrites the
#       step literal in `walk += 4` / `walk + 4` for the named variable only. Not
#       detected by the scanner; find by reading code or by a difftest.
#
#   [[pointer.audit]]    file="..." line=NN ok=true note="compare-only"
#       A ptr->narrow cast reviewed and judged benign (records intent; no rewrite).
#
# KNOWN LIMITATION of the heuristic scanner: it catches a narrow-int parameter
# only when its own function dereferences it (narrow_param_deref), and only for
# single-line signatures; it does not follow pointer values across a call
# boundary. Pointer-size strides (`p += 4` over a pointer array) are not detected at
# all. Deliberately-unresolved findings: docs/mirror/pointer-width-deferred.md. Those need type-aware analysis (libclang, P1) and, ultimately, the
# oracle-vs-mirror behavioral diff harness to *prove* a TU is correct. A "0
# critical" worklist means "no line-visible hazard left", not "proven sound".

# --- track_dolphin.c (pilot) -------------------------------------------------
# Resolutions for the 12 criticals in the first P2 run over the collision pilot.
# The three collision buffers are declared narrow but hold pointers; the cast
# sites feed/consume those same pointers.

[[pointer.promote]]
file = "decomp/src/main/track_dolphin.c"
symbol = "gIntersectLinePool"
to = "uintptr_t"
note = "scratch line pool; (int)mmAlloc @ trackInitCollisionBuffers, deref'd as (u8*)"

