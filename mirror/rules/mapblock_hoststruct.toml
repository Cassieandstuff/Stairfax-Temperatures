# Map blocks in the HOST layout (pointer-slot survey item 2: HOST-STRUCT), and
# shader texture slots holding IDs (survey item 3; texture_ids.toml).
#
# mirror/runtime/stairfax_mapblock.c loads a block and transcodes MapBlockData,
# its Shader table and its display-list records to host layout. Map textures stay
# pinned pointers in the block's own table (the override table and textureFree
# key on them); shader slots get each texture's loaded-texture ID, and the code
# that read slots as pointers resolves the ID with textureIdxToPtr.
# Generated by tools/mirror/gen_mapblock_hoststruct_rules.py; comments say why.

[[text.replace]]
file = "decomp/src/main/tex_dolphin.c"
line = 1619  # load + transcode to host layout (mirror/runtime/stairfax_mapblock.c)
from = "loadAndDecompressDataFile(MLDF_FILEID_BLOCKS_BIN_A, buf, blockOff, compressedLen, 0, 0, 0);"
to = "buf = stairfax_mapblock_load_unpacked(buf, decompressedSize, blockOff, compressedLen);"

[[text.replace]]
file = "decomp/src/main/tex_dolphin.c"
line = 982  # MWCC fixed-address syntax spelled out; AT_ADDRESS expands to nothing off-MWCC
from = " : (0xCC008000)"
to = ""

[[text.replace]]
file = "decomp/src/main/texture.c"
line = 97  # after textureIdxToPtr: the ID of a loaded (pinned) texture; same line, so no line shifts
from = "}"
to = "} int stairfax_texture_id_of(void* texture) { int i; for (i = 0; i < gLoadedTextureCount; i++) { if (gLoadedTextures[i].texture == (u8*)texture) return i + 1; } return 0; }"

[[text.replace]]
file = "decomp/src/main/tex_dolphin.c"
line = 1480  # shader slot holds the texture's ID
from = "sh->layers[j].texture = block->textures[ref].texture;"
to = "sh->layers[j].textureIndex = stairfax_texture_id_of(block->textures[ref].texture);"

[[text.replace]]
file = "decomp/src/main/tex_dolphin.c"
line = 1484  # the override table keys on the texture pointer
from = "mapTextureOverrideAcquire(sh->layers[j].texture,"
to = "mapTextureOverrideAcquire((Texture*)textureIdxToPtr(sh->layers[j].textureIndex),"

[[text.replace]]
file = "decomp/src/main/tex_dolphin.c"
line = 1496  # shader slot holds the texture's ID
from = "sh->auxTexture = block->textures[ref].texture;"
to = "sh->auxTextureIndex = stairfax_texture_id_of(block->textures[ref].texture);"

[[text.replace]]
file = "decomp/src/dlls/objects/308_texscroll2/texscroll2.c"
line = 61  # shader texture slots hold IDs (texture_ids.toml)
from = "shader->layers[materialIndex].texture"
to = "((Texture*)textureIdxToPtr(shader->layers[materialIndex].textureIndex))"

