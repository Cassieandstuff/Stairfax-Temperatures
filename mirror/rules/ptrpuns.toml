# Narrow-int puns on runtime POINTER storage: `*(u32*)&p->field`, `(u32*)&ptrLocal`
# passed as an out-parameter. On a 64-bit host they read or write only the low 4
# bytes of an 8-byte pointer: reads truncate, writes leave the high half stale.
# Found by a libclang sweep of the mirror for (narrow-int*)&<pointer lvalue>.
# Each becomes the pointer-width integer type. (On-disc relocation in model.c and
# the ObjMsg queue are layout problems, not puns; they're tracked separately.)

