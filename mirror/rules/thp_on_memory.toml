# Attract-movie "on memory" playback: the preloaded-movie cursor is passed as an
# integer to the video decode thread.
#
#   dll_3e.c prepareAttractMode:
#     s32 startOffset;
#     startOffset = ((s32)ctrl->loopFrame + ctrl->frameOffset) - ctrl->dataOffset;
#     CreateVideoDecodeThread(0xf, startOffset);  CreateAudioDecodeThread(0xc, (void*)startOffset);
#   THPVideoDecode.c CreateVideoDecodeThread(OSPriority, u32 onMemoryArg)
#     -> OSCreateThread(..., (void*)onMemoryArg, ...)  -> receiver: void* cur = param;
# ctrl->loopFrame is a real void* into the preloaded movie (frameOffset and
# dataOffset are u32 file offsets, frameOffset >= dataOffset), so startOffset is
# a pointer. Widen the (s32) cast, the local, and the param on its definition and
# its picmenu.h prototype. (dolphin/thp/THPVideoDecode.h declares the param as
# void* task; that SDK header already disagrees and isn't the one these TUs use.)

[[pointer.widen_cast]]
