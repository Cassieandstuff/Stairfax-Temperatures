# objprint.c: staffUpdateSegmentTransforms and its one caller pass object
# pointers through ints, and the caller walks obj->childObjs with a 4-byte
# pointer stride.
#
# Caller (objPrint loop, ~1384-1436):
#   walk = (int)obj;  int staff = (int)((GameObject*)walk)->childObjs[0];
#   staffUpdateSegmentTransforms(staff, obj, (int)OBJPRINT_ACTIVE_BANK(staff), ...);
#   walk += 4;   // steps childObjs[] assuming 4-byte pointers
# All of it widens together. The `+= 4` matters most: widening the ints alone
# would compile, read "0 critical", and then read garbage for every child after
# the first, because 64-bit pointers are 8 bytes apart.
#
# The public prototype (objprint_api.h:21) already declares the params as
# GameObject*/ObjModel*; the definition takes uintptr_t (same 64-bit integer-class
# ABI) so the int-typed caller chain stays consistent.

