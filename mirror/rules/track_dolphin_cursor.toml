# track_dolphin.c triangle-buffer cursor chain (2nd pass, forced by the compiler once
# track_dolphin.c joined the 64-bit build set). The cursor into gTrackTriangleBuffer
# flows: caller `int cur` -> trackBuildBlockTriangles(int base) / trackBuildModelTriangles
# (int cur) -> both return it as int; the end bound is stored via
# `gTrackTriangleBufferEnd = (u32)(buf + 1200)` and compared via `(u32)cur >= end`.
# The first pass (pointers.toml) only widened what the line scanner could see. The
# truncating (u32) store at 3386 and the (u32) compares were review-level and missed.
#
# NOT here, on purpose: trackGetTriangleBuffer(int* outCount, int* outTable) and its
# callers (shadow_dolphin.c:693+, engine/13/13.c:210). Retyping outTable alone would
# make the callee write 8 bytes into callers' 4-byte ints, so that whole chain moves
# together in the automated pass.

